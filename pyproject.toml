[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aquascan-open-science"
version = "0.1.0"
description = "Open Science framework for multimodal hydrogeophysical groundwater prospecting research"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "AquaScan Research"},
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache License, Version 2.0",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "click>=8.1",
    "httpx>=0.25",
    "numpy>=1.25",
    "pandas>=2.0",
    "pydantic>=2.5",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "shapely>=2.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
geo = ["geopandas>=0.14"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.7",
    "pre-commit>=3.5",
]

[project.scripts]
aquascan = "aquascan.cli:main"

[project.urls]
Homepage = "https://github.com/aquascan-research/aquascan-open-science"
Documentation = "https://aquascan-research.github.io/aquascan-open-science"
Repository = "https://github.com/aquascan-research/aquascan-open-science"
Issues = "https://github.com/aquascan-research/aquascan-open-science/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "B008", # do not perform function calls in argument defaults
    "N818", # exception class names don't need "Error" suffix
]

[tool.ruff.lint.per-file-ignores]
"scripts/run_baseline.py" = ["N806"]  # X, y scikit-learn convention
"src/aquascan/baselines/*.py" = ["N803", "N806"]  # X, y, C scikit-learn convention
"src/aquascan/evaluation/geographic_split.py" = ["N806"]  # X for sklearn
"src/aquascan/features/build.py" = ["N806"]  # X for sklearn
"tests/*.py" = ["B017"]  # pytest.raises(Exception) is acceptable in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["aquascan"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"